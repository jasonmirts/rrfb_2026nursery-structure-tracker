<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coral tree tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
:root{--abyss:#07262e;--bg:#e8f0ef;--panel:#f5f9f8;--card:#fff;--ink:#0d2830;--muted:#536c72;--line:#d3e0df;--line2:#e3ecea;--acc:#0e7c8b;--on-acc:#fff;--soft:#dcf0f1;--bad:#bd382a;--on-bad:#fff;--ok:#1b8455;--on-ok:#fff;--okt:#17724a;--field:#fff;
--fd:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;--fb:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081518;--panel:#0e2025;--card:#13303a;--ink:#e4f0ef;--muted:#8fa9ae;--line:#26444d;--line2:#1b353d;--acc:#4dc2d3;--on-acc:#04252b;--soft:#173f49;--bad:#ee7b6e;--on-bad:#2a0d09;--ok:#4cc48a;--on-ok:#04200f;--okt:#6fd19a;--field:#0e2025}}
:root[data-theme="dark"]{--bg:#081518;--panel:#0e2025;--card:#13303a;--ink:#e4f0ef;--muted:#8fa9ae;--line:#26444d;--line2:#1b353d;--acc:#4dc2d3;--on-acc:#04252b;--soft:#173f49;--bad:#ee7b6e;--on-bad:#2a0d09;--ok:#4cc48a;--on-ok:#04200f;--okt:#6fd19a;--field:#0e2025}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto minmax(0,1fr);font:15px/1.45 var(--fb);background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--abyss);color:#dff0ef;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font:700 18px/1 var(--fd);white-space:nowrap;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.locs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.locs::-webkit-scrollbar{display:none}
.loc{position:relative;display:flex;flex:none;border-radius:999px;background:rgba(255,255,255,.08);transition:background .12s}
.loc>button.l{background:none;border:0;color:inherit;padding:7px 14px;border-radius:999px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.loc>button.l small{font-weight:400;opacity:.65;font-size:12px}
.loc:hover{background:rgba(255,255,255,.14)}
.loc.on{background:#e6f6f7;color:#07343c}
.loc.drop{outline:2px dashed #8fe3f0;outline-offset:2px;background:rgba(143,227,240,.3)}
.loc.mx>button.l{padding-right:30px}
.loc.add>button.l{font-weight:400;opacity:.85}
.loc>button.x{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.acts{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;opacity:.85;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7e9aa0}
.sync[data-s=synced] i{background:#5fd09a}.sync[data-s=saving] i{background:#e0b43a}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.09);color:#dff0ef}
.ibtn:hover:not(:disabled){background:rgba(255,255,255,.18)}.ibtn:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--acc)}.btn.on{background:var(--soft);border-color:var(--acc)}
.top .btn.pri{background:#68d3e0;border-color:#68d3e0;color:#04262c}.top .btn.pri:hover{filter:brightness(1.07)}
button.x{width:20px;height:20px;padding:0;border:0;border-radius:50%;background:var(--bad);color:var(--on-bad);font-size:14px;line-height:1;display:inline-grid;place-items:center;opacity:0}
.loc:hover button.x,.loc:focus-within button.x,.it:hover button.x,.fxr:hover button.x,.fxr:focus-within button.x,button.x:focus-visible{opacity:1}
@media (hover:none){button.x{opacity:1}}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
@media (max-width:860px){
 .top{flex-wrap:wrap;row-gap:8px}.locs{order:3;flex-basis:100%}.acts{margin-left:auto}.sync span{display:none}
 main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,54%)}
 aside{border-left:0!important;border-top:1px solid var(--line)}
}

/* map */
#map{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 100% at 22% -10%,#15626f 0%,#0b3b47 48%,#061f27 100%)}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.selm{cursor:crosshair}
#svg line{stroke:rgba(150,214,224,.07);stroke-width:1}#svg line.mj{stroke:rgba(150,214,224,.2)}#svg line.ax{stroke:rgba(150,214,224,.36);stroke-width:1.5}
#svg line.gd{stroke:#8fe3f0;stroke-width:1.5;stroke-dasharray:4 3}#svg .gl{fill:rgba(176,226,233,.5);font-size:11px}
.lb{fill:#e6f6f7;font:700 12.5px var(--fb);text-anchor:middle;paint-order:stroke;stroke:#08303a;stroke-width:3.5px;stroke-linejoin:round}
.tree{cursor:grab}.dot{stroke:rgba(255,255,255,.55);stroke-width:2}
.halo{display:none;fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:2.5}.sel .halo{display:block}
.bd{fill:#fff;font-size:10px;text-anchor:middle;font-weight:700}
.bn{font-size:10px;font-weight:700;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:2.5px}
.fn{fill:#10262b;font-size:10px;font-weight:700;text-anchor:middle}
.hd{display:none;cursor:pointer}.hd circle{stroke:#fff;stroke-width:1.5}.hd path{pointer-events:none}
.hdx circle{fill:#bd382a}.hdc circle{fill:#1a8a9a}
.tree:hover .hd{display:block}
@media (hover:none){.tree.sel .hd{display:block}}
.ghost{opacity:.55;pointer-events:none}
.mq{fill:rgba(79,179,198,.18);stroke:#9ad8e4;stroke-width:1.5;stroke-dasharray:5 3;pointer-events:none}
#empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;color:#b6dde2;pointer-events:none;padding:30px}
#empty b{font:700 18px var(--fd);color:#e6f6f7}
#empty svg{width:42px;height:42px;opacity:.8;margin-bottom:4px}

/* dock and popovers over the map */
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px;background:rgba(5,28,35,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(150,214,224,.2);box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 16px)}
.dock button{white-space:nowrap;position:relative;background:none;border:0;color:#d8eef0;height:34px;min-width:34px;padding:0 9px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700}
.dock button:hover{background:rgba(255,255,255,.12)}
.dock button.on{background:#e3f6f8;color:#07343c}
.dock .sep{width:1px;height:20px;background:rgba(150,214,224,.25);margin:0 4px;flex:none}
.dock .tx{display:none}
@media (min-width:1600px){.dock .tx{display:inline}}.expb .lg{display:none}@media (min-width:1600px){.expb .lg{display:inline}}
.dock em{font-style:normal;font-size:11px;background:#e0b43a;color:#251c05;border-radius:999px;padding:0 6px;line-height:16px}
.pop{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);width:min(440px,calc(100% - 20px));max-height:calc(100% - 96px);overflow:auto;border-radius:14px;background:rgba(5,28,35,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(150,214,224,.22);color:#d8eef0;padding:12px 14px 14px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:13.5px}
.pop-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.pop-h b{font:700 16px var(--fd)}
.pop button.pclose{background:none;border:0;color:#d8eef0;font-size:20px;line-height:1;width:28px;height:28px;border-radius:8px}.pop button.pclose:hover{background:rgba(255,255,255,.12)}
.pop h4{margin:12px 0 4px;font:700 13.5px var(--fd);color:#e6f6f7}.pop h4:first-of-type{margin-top:0}
.pop .hint{color:#9cc3ca}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}@media (max-width:520px){.lgrid{grid-template-columns:1fr}}
.lr{display:flex;align-items:center;gap:6px;margin:1px 0}.lr svg{flex:none;width:26px;height:26px}
.pop input,.pop select{background:rgba(255,255,255,.08);border:1px solid rgba(150,214,224,.28);color:#e8f6f7;border-radius:8px;padding:7px 9px;min-width:0}
.pop select option{color:#0d2830}
.pop button.add,.pop .mv button{background:rgba(255,255,255,.1);border:1px solid rgba(150,214,224,.28);color:#e8f6f7;border-radius:8px;padding:6px 12px;font-weight:700}
.fxadd{display:grid;grid-template-columns:1fr 92px auto;gap:6px;margin-bottom:8px}
.fxr{display:grid;grid-template-columns:auto 1fr 92px auto auto;gap:6px;align-items:center;margin:5px 0}
.fxr.dn .fxt{text-decoration:line-through;opacity:.55}
.mv{display:flex;gap:2px}.mv button{padding:2px 7px!important;font-size:11px!important}
.pop select.p-h{border-left:4px solid #ee7b6e}.pop select.p-m{border-left:4px solid #e0b43a}.pop select.p-l{border-left:4px solid #6aa3ae}
#dchip{position:fixed;z-index:40;pointer-events:none;display:none;padding:5px 12px;border-radius:999px;background:#07343c;color:#e6f6f7;font-size:12.5px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid rgba(143,227,240,.55);white-space:nowrap}

/* details panel */
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2.5px solid transparent;margin-bottom:-1px;padding:13px 6px 11px;font:700 15px var(--fd);color:var(--muted)}
.tabs button:hover{color:var(--ink)}.tabs button.on{color:var(--ink);border-color:var(--acc)}
.tabs em{font-style:normal;font:700 11.5px var(--fb);margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--bad);color:var(--on-bad)}
.pane{flex:1;min-height:0;overflow:auto;padding:16px 16px 56px;display:grid;gap:20px;align-content:start}
.sec{display:grid;gap:9px;min-width:0}
.sec>h3,.sec>.sh{margin:0;font:700 15.5px var(--fd);letter-spacing:-.005em}
.hint{margin:0;color:var(--muted);font-size:13px}
.hint small{font-size:inherit}
.grow{flex:1;min-width:0}
.phead{display:flex;gap:8px;align-items:flex-start}
.pt{margin:0;font:700 21px/1.2 var(--fd);letter-spacing:-.01em}
.meta{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
textarea.in{resize:vertical;min-height:70px}
.title-in{font:700 22px/1.2 var(--fd);letter-spacing:-.01em;border-color:transparent;background:transparent;padding:3px 8px;margin-left:-8px;width:calc(100% + 8px)}
.title-in:hover{border-color:var(--line)}.title-in:focus{background:var(--field);border-color:var(--acc)}
.ibtn2{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);flex:none}
.ibtn2:hover{border-color:var(--acc);color:var(--acc)}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.blank{display:grid;gap:8px;padding:28px 6px;text-align:center;justify-items:center}
.blank b{font:700 17px var(--fd)}
.multi{display:grid;gap:6px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.multi b{font:700 16px var(--fd)}
.linkb{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font-size:13px;justify-self:start}

/* fouling and dates */
.fl{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.fl button{position:relative;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:700 17px var(--fd);padding:0 0 5px}
.fl button::after{content:"";position:absolute;left:9px;right:9px;bottom:6px;height:4px;border-radius:2px;background:var(--c)}
.fl button:hover{border-color:var(--c)}
.fl button.on{background:var(--c);border-color:var(--c);color:var(--tc)}.fl button.on::after{display:none}
.flc{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2)}
.dr>span{color:var(--muted);font-size:14px}
.dtb{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;min-width:128px;text-align:right;font-size:14px}
.dtb:hover{border-color:var(--acc)}
.dp{position:fixed;z-index:50;width:264px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 14px 36px rgba(7,38,46,.28)}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.dp-h b{font:700 14.5px var(--fd)}
.dp-h button,.dp-f button{background:none;border:0;border-radius:8px;padding:4px 9px;color:var(--ink)}.dp-h button:hover,.dp-f button:hover{background:var(--soft)}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-g span{font-size:11.5px;color:var(--muted);text-align:center;padding:3px 0}
.dp-g button{height:32px;border:0;border-radius:8px;background:none;font-size:14px}
.dp-g button:hover{background:var(--soft)}.dp-g button.td{box-shadow:inset 0 0 0 1.5px var(--acc)}.dp-g button.sl{background:var(--acc);color:var(--on-acc);font-weight:700}
.dp-f{display:flex;justify-content:space-between;margin-top:6px}

/* categories */
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;font:700 15.5px var(--fd);text-align:left}
.gh small{font:700 12px var(--fb);color:var(--on-bad);background:var(--bad);border-radius:999px;padding:1px 9px}
.gh .chev{display:inline-block;width:14px;transition:transform .15s}.gh[aria-expanded=false] .chev{transform:rotate(-90deg)}
.grp{background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.grp>h4{margin:0;padding:9px 13px 7px;font:700 12.5px var(--fd);color:var(--muted)}
.it{position:relative;display:grid;gap:7px;padding:10px 13px;border-top:1px solid var(--line2)}
.it>span.nm{font-weight:700;font-size:14px}
.it>span.nm em{font-weight:400;color:var(--muted)}
.seg2{display:grid;grid-template-columns:1fr 1.3fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:var(--card);padding:7px 6px;font-size:13px}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button:hover{background:var(--soft)}
.seg2 .on.ok{background:var(--ok);color:var(--on-ok);font-weight:700}.seg2 .on.no{background:var(--bad);color:var(--on-bad);font-weight:700}

/* issues */
.sm{display:grid;grid-template-columns:minmax(70px,1fr) 2fr auto;gap:10px;align-items:center;padding:3px 0}
.smb{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.smb i{display:block;height:100%;background:var(--bad)}.sm b{min-width:1.5em;text-align:right}
.sm.hd2{display:block;margin-top:6px;font:700 13px var(--fd);color:var(--muted)}
.tr{border-bottom:1px solid var(--line)}.tr summary{display:flex;justify-content:space-between;gap:8px;padding:10px 2px;cursor:pointer;font-weight:700;list-style:none}
.tr summary::-webkit-details-marker{display:none}
.tr summary::before{content:"▸";color:var(--muted);margin-right:8px;transition:transform .12s}.tr[open] summary::before{transform:rotate(90deg)}
.tr summary span{flex:1}
.tr summary small{font-weight:400}.tr summary small.no{color:var(--bad)}.tr summary small.na{color:var(--muted)}
.trb{padding:0 2px 12px 18px}.trm{margin-top:6px;color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line2)}.kv span{color:var(--muted)}.kv b{font-weight:400;text-align:right}.kv b.ok{color:var(--okt)}.kv b.no{color:var(--bad)}.kv b.na{color:var(--muted)}
.tn{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px}
.prev h3{margin:12px 0 2px;font:700 14px var(--fd)}.prev .note{white-space:pre-wrap;margin:0}

/* setup */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{display:grid;gap:6px;justify-items:center;align-content:start;padding:8px 6px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:center;font:700 13px/1.2 var(--fd)}
.tc:hover{border-color:var(--acc)}.tc.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.tdg{width:100%;max-width:470px;height:auto;display:block;margin:0 auto}
.tdg.mini{height:116px;width:auto;max-width:100%;pointer-events:none}
.tdg text{font:15px var(--fb);fill:var(--ink)}
.tdg .dn{fill:#fff;font-size:10px;font-weight:700}.tdg .tg{fill:#fff;font-size:11px;font-weight:700}
.tdg .ld{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;fill:none;opacity:.75}
.tdg [data-part]{cursor:pointer}
.tdg .plab:hover text,.tdg .plab.on text{font-weight:700}.tdg .plab.on text{text-decoration:underline}
.tdg .plab:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tdg .part:hover :is(rect,circle,path,ellipse,line):not(.hit),.tdg .part.on :is(rect,circle,path,ellipse,line):not(.hit){stroke:var(--acc);stroke-width:2.5}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}.bar i{display:block;height:100%}
.bar .b1{background:var(--ok)}.bar .b2{background:var(--bad)}.bar .b3{background:var(--line)}
.partp{display:grid;gap:8px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line2)}
.partp h4{margin:0;font:700 15px var(--fd)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(255,255,255,.07);color:#dff0ef;font-weight:700;font-size:13.5px;white-space:nowrap}.tb:hover{background:rgba(255,255,255,.16)}
@media (max-width:1320px){.tb span{display:none}.tb{width:34px;padding:0;justify-content:center}}
.eh{padding:6px 11px 2px;font:700 11.5px var(--fb);color:#7fa9b1}
.expb .ic.up{width:15px;height:15px;opacity:.75}
.expb{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:12px;border:1px solid rgba(150,214,224,.25);background:#68d3e0;color:#04262c;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.expb:hover{filter:brightness(1.07)}

 else if(a==='foul'){const n=+d.n,ts=targets(),allHave=ts.every(x=>x.foul===n);ts.forEach(x=>{if(allHave)delete x.foul;else{x.foul=n;x.since=today();if(n===1)x.cleaned=today()}})}
 else if(a==='clearsel'){msel.clear();sel=null}
 else if(a==='std'){const ts=targets(),allHave=ts.every(x=>x.std?.[d.k]===d.v);ts.forEach(x=>{x.std??={};if(allHave)delete x.std[d.k];else x.std[d.k]=d.v})}
 else if(a==='cats'){catsOpen=!catsOpen;return panel()}
 else if(a==='dup'){dupSel();return}
 else if(a==='row'||a==='col'){lineUp(a==='row'?'row':'column');return}
 else if(a==='grid'){S.site.grid=+d.g;toast('Grid set to '+d.g+' m')}
 else if(a==='snaptog'){S.site.snap=!snapOn()}
 else if(a==='snapall'){const L=S.trees.slice().sort((p,q)=>q.y-p.y||p.x-q.x),done=[];S.site.snap=true;L.forEach(t=>{const[x,y]=freeCell({...S.site,trees:done},t.x,t.y);t.x=+x.toFixed(2);t.y=+y.toFixed(2);done.push(t)});toast('Aligned '+nTrees(L.length)+' to the grid')}
 else if(a==='type'){if(S.site.type===d.t)return;S.site.type=d.t;if(setupPart&&!KS().has(setupPart))setupPart=null;toast(S.site.name+' now uses the '+TYPES[d.t].name+' layout. Ratings for parts it does not have are kept.')}
 all()});
$('#side').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.tid){if(d.open)issOpen.add(d.dataset.tid);else issOpen.delete(d.dataset.tid)}},true);
$('#side').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('plab')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#side').addEventListener('change',e=>{const el=e.target,f=el.dataset.f,t=T(),v=el.value;if(!f)return;
 if(f==='name'&&t)t.name=v.trim()||t.name;
 else if(f==='notes'&&t)t.notes=v;
 else if(f==='dn'){targets().forEach(x=>(x.dn??={})[el.dataset.k]=v)}
 else if(f==='sname')S.site.name=v.trim()||S.site.name;
 else return;
 all()});
$('#side').addEventListener('input',e=>{const el=e.target,f=el.dataset.f;if(!f)return;const t=T(),v=el.value;
 if(f==='sname'){if(v.trim())S.site.name=v;locsDraw()}
 else if(f==='name'&&t){if(v.trim())t.name=v;drawMap()}
 else if(f==='notes'&&t)t.notes=v;
 else if(f==='dn')targets().forEach(x=>(x.dn??={})[el.dataset.k]=v);
 else return;
 persist()});

/* ---- export ---- */
const csvCell=v=>{v=v==null?'':String(v);return /[",\r\n]/.test(v)||/^\s|\s$/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csvText=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function cleanBand(t){const c=cleanInfo(t);return c.k==='a'?'0-2 weeks':c.k==='b'?'2-4 weeks':c.k==='c'?'4+ weeks':'No date'}
function treesCsv(){const head=['Location','Tree type','Tree','X (m)','Y (m)','Fouling (1 clean - 5 dirty)','Rated on','Last cleaned','Days since cleaned','Cleaning period','Observed on','Corals','Other items below standard','Other items meeting standard','Other items assessed','Tree notes'];
 ALLK.forEach(k=>{const n=k.replace('|',' - ');head.push(n,n+' - note')});
 const rows=[head];
 D.sites.forEach(site=>{const ty=TYPES[site.type]||TYPES.boulder,ks=new Set(ty.keys),nch=ty.keys.filter(k=>!k.startsWith('Coral Health|'));
  site.trees.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).forEach(t=>{const ci=cleanInfo(t);let no=0,ok=0;nch.forEach(k=>{const v=t.std?.[k];if(v===NO)no++;else if(v===OK)ok++});
   const cv=t.std?.['Coral Health|Corals'];
   const r=[site.name,ty.name,t.name,t.x,t.y,t.foul??'',t.since||'',t.cleaned||'',ci.days??'',cleanBand(t),t.obs||'',cv===OK?OK:cv===NO?NO:'Not assessed',no,ok,no+ok,t.notes||''];
   ALLK.forEach(k=>{const v=t.std?.[k];r.push(!ks.has(k)?'N/A':v||'Not assessed',v===NO?(t.dn?.[k]||''):'')});rows.push(r)})});
 return csvText(rows)}
function fixesCsv(){const rows=[['Location','Priority','Done','Fix item']],PN={h:'High',m:'Medium',l:'Low'};
 D.sites.forEach(site=>{fixOrder(site.fixes).forEach(i=>{const f=site.fixes[i];rows.push([site.name,PN[f.p]||f.p,f.done?'Yes':'No',f.text])})});return csvText(rows)}
async function saveFile(filename,text,mime='text/csv',label='Exported '){let dl=null;try{dl=await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename,data:text});toast(label+filename,false)}catch(e){if(e&&e.code!=='declined')toast('Could not save: '+(e.message||e.code),false)}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(label+filename,false)}
$('#exp').innerHTML=ic('grid')+'<span class="lg">Import / Export </span>CSV'+ic('up').replace('class="ic"','class="ic up"');
function expMenu(open){$('#expm').hidden=!open;$('#exp').setAttribute('aria-expanded',String(open))}
$('#exp').addEventListener('click',e=>{e.stopPropagation();expMenu($('#expm').hidden)});
$('#expm').addEventListener('click',e=>{const b=e.target.closest('[data-exp]');if(!b)return;expMenu(false);const d=today();if(b.dataset.exp==='import'){$('#csvin').click();return}b.dataset.exp==='trees'?saveFile('coral-trees-'+d+'.csv',treesCsv()):saveFile('coral-fix-list-'+d+'.csv',fixesCsv())});
document.addEventListener('pointerdown',e=>{if(!$('#expm').hidden&&!e.target.closest('#expm,#exp'))expMenu(false)});

/* ---- backup file and csv import ---- */
$('#bsave').innerHTML=ic('download')+'<span>Save Backup (.JSON)</span>';$('#bload').innerHTML=ic('upload')+'<span>Load Backup (.JSON)</span>';
const nSum=()=>D.sites.reduce((n,s)=>n+s.trees.length,0);
function saveBackup(){saveFile('coral-tree-backup-'+today()+'.json',JSON.stringify({app:'coral-tree-tracker',savedAt:new Date().toISOString(),...D},null,1),'application/json','Backup saved as ')}
async function loadBackup(file){let p=null;try{p=migrate(JSON.parse((await file.text()).replace(/^\ufeff/,'')))}catch(e){}
 if(!p||!Array.isArray(p.sites)){toast('That file is not a Coral tree tracker backup.',false);return}
 delete p.app;delete p.savedAt;D=p;sel=null;msel.clear();setupPart=null;hov=null;D.sites.forEach(s=>dirty.add(s.id));all();toast('Loaded backup: '+nTrees(nSum())+' in '+D.sites.length+(D.sites.length===1?' location':' locations'))}
$('#bsave').onclick=saveBackup;$('#bload').onclick=()=>$('#bakin').click();
$('#bakin').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)loadBackup(f)});
function parseCsv(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/,1)[0],del=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',',rows=[];let row=[],c='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===del){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(c);c='';rows.push(row);row=[]}else c+=ch}
 if(c!==''||row.length){row.push(c);rows.push(row)}return rows.filter(r=>r.some(x=>x!==''))}
const pdate=v=>{v=(v||'').trim();if(!v)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+pad(+m[1])+'-'+pad(+m[2]);const d=new Date(v+' 12:00');return isNaN(d)?null:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function importCsv(text){const rows=parseCsv(text),H=(rows[0]||[]).map(h=>h.trim()),ix=n=>H.indexOf(n);
 const isT=ix('Tree')>=0&&ix('Location')>=0,isF=ix('Fix item')>=0&&ix('Location')>=0;
 if(rows.length<2||(!isT&&!isF)){toast('That CSV is not a Trees or Fix list export from this app.',false);return}
 let made=0,added=0,upd=0,skipped=0,fixes=0;
 const siteBy=(n,tn)=>{n=(n||'').trim();if(!n)return cur();let s=D.sites.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!s){s=newSite(n);const k=Object.keys(TYPES).find(k=>TYPES[k].name===tn);if(k)s.type=k;D.sites.push(s);made++}return s};
 rows.slice(1).forEach(r=>{const raw=n=>{const i=ix(n);return i<0?undefined:(r[i]??'')},g=n=>{const v=raw(n);return v===undefined?undefined:v.trim()};
  const site=siteBy(g('Location'),g('Tree type'));
  if(isF){const tx=g('Fix item');if(!tx)return;if(site.fixes.some(f=>f.text.toLowerCase()===tx.toLowerCase()))return;const pv=(g('Priority')||'').toLowerCase();site.fixes.push({id:uid(),text:tx,p:pv.startsWith('h')?'h':pv.startsWith('l')?'l':'m',done:/^(yes|true|1|done)$/i.test(g('Done')||'')});fixes++;return}
  const nm=g('Tree');if(!nm)return;let t=site.trees.find(x=>x.name.toLowerCase()===nm.toLowerCase());const isNew=!t;if(isNew)t={id:uid(),name:nm,x:0,y:0,notes:''};
  const x=g('X (m)'),y=g('Y (m)');if(x!==undefined&&y!==undefined&&x!==''&&y!==''&&!isNaN(+x)&&!isNaN(+y)){t.x=+x;t.y=+y}else if(isNew){[t.x,t.y]=freeCell(site,0,0)}
  const fv=g('Fouling (1 clean - 5 dirty)');if(fv!==undefined){const n=+fv;if(fv!==''&&n>=1&&n<=5)t.foul=Math.round(n);else if(fv==='')delete t.foul}
  [['since','Rated on'],['cleaned','Last cleaned'],['obs','Observed on']].forEach(([f,n])=>{const v=g(n);if(v===undefined)return;if(v===''){delete t[f];return}const d=pdate(v);if(d===null)skipped++;else t[f]=d});
  const tn=raw('Tree notes');if(tn!==undefined)t.notes=tn;
  ALLK.forEach(k=>{const n=k.replace('|',' - '),v=g(n);if(v===undefined||v==='N/A')return;t.std??={};if(v===OK)t.std[k]=OK;else if(v===NO)t.std[k]=NO;else delete t.std[k];
   const nv=raw(n+' - note');t.dn??={};if(v===NO&&nv!==undefined){if(nv.trim())t.dn[k]=nv;else delete t.dn[k]}else if(v!==NO)delete t.dn[k]});
  if(isNew){site.trees.push(t);added++}else upd++});
 all();toast('Imported '+(isT?nTrees(added+upd)+' ('+added+' new, '+upd+' updated)':fixes+' fix '+(fixes===1?'item':'items'))+(made?', '+made+' new '+(made===1?'location':'locations'):'')+(skipped?'. '+skipped+' dates were skipped':''))}
$('#csvin').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)importCsv(await f.text())});

/* ---- sync ---- */
async function loadRemote(){try{db=await claude.use('db')}catch(e){db=null}
 if(!db)return setSync('local','Autosaved');
 try{const c=await db.doc('app/config').get();
  if(!c.exists){D.sites.forEach(s=>dirty.add(s.id));return flush()}
  const cf=c.data();
  if(hadLocal&&(cf.ts==null||(D.ts||0)>cf.ts)){D.sites.forEach(s=>dirty.add(s.id));return flush()}
  const sites=[];for(const id of cf.order||[]){const d=await db.doc('sites/'+id).get();if(d.exists)sites.push(d.data())}
  const p=migrate({opts:cf.opts,sites,cur:cf.cur});if(p){p.ts=cf.ts||0;D=p;last=snap();undoS=[];redoS=[];updHist();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}sel=null;msel.clear();redrawAll()}
  setSync('synced','Saved and synced')}catch(e){setSync('local','Autosaved')}}
new ResizeObserver(drawMap).observe($('#map'));dockDraw();panel();updHist();setSync('local','Autosave on');IDB.get().then(raw=>{try{const q=raw&&migrate(JSON.parse(raw));if(q&&(q.ts||0)>(D.ts||0)){D=q;last=snap();redrawAll()}}catch(e){}});loadRemote();
</script></body></html>
